<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff2b2b" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="228" rx="14" fill="none" stroke="#ff2b2b" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="30" font-weight="700" fill="url(#textGrad)">
    Hi, I'm Nahid 👋
  </text>
  <text x="450" y="86" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#e0a0a0">
    Cybersecurity Enthusiast • Web Developer • Reverse Engineer
  </text>

  <!-- Dev stack icons row -->
  <g font-family="Segoe UI, Verdana, sans-serif">
    <!-- Next.js -->
    <g transform="translate(80,150)">
      <image href="https://cdn.simpleicons.org/nextdotjs/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="0s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">Next.js</text>
    </g>
    <!-- React -->
    <g transform="translate(180,150)">
      <image href="https://cdn.simpleicons.org/react/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">React</text>
    </g>
    <!-- Django -->
    <g transform="translate(280,150)">
      <image href="https://cdn.simpleicons.org/django/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">Django</text>
    </g>
    <!-- Node.js -->
    <g transform="translate(380,150)">
      <image href="https://cdn.simpleicons.org/nodedotjs/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">Node.js</text>
    </g>
    <!-- Python -->
    <g transform="translate(480,150)">
      <image href="https://cdn.simpleicons.org/python/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">Python</text>
    </g>
    <!-- C -->
    <g transform="translate(580,150)">
      <image href="https://cdn.simpleicons.org/c/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="1.0s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">C</text>
    </g>
    <!-- C++ -->
    <g transform="translate(680,150)">
      <image href="https://cdn.simpleicons.org/cplusplus/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">C++</text>
    </g>
    <!-- Rust -->
    <g transform="translate(780,150)">
      <image href="https://cdn.simpleicons.org/rust/ff2b2b" x="-24" y="-24" width="48" height="48" filter="url(#redGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="1.6s" begin="1.4s" repeatCount="indefinite"/>
      </image>
      <text x="0" y="46" text-anchor="middle" font-size="12" fill="#ffbaba">Rust</text>
    </g>
  </g>
</svg>
